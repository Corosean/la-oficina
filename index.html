<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--noche:#080b14;--voz:#EDE7DA;--tenue:#8e97a6;--nota:#2438E8;--ok:#35d07f;--ambar:#ffb020;--roja:#ff4d4d;--carta:rgba(12,15,25,.9);--linea:#222a3b;--suave:#141a2a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--noche);color:var(--voz);font-family:Archivo,system-ui,sans-serif}
#app canvas{display:block;touch-action:none}
button,a.btn{font:inherit;color:inherit;cursor:pointer;text-decoration:none}
.glass{background:var(--carta);border:1px solid var(--linea);border-radius:12px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.mono{font-family:'JetBrains Mono',monospace}
#bar{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:8px 12px;z-index:8;background:rgba(8,11,20,.92);border-bottom:1px solid var(--linea);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;padding-right:6px}
.brand .logo{width:28px;height:28px;border-radius:8px;background:var(--nota);display:grid;place-items:center;font-weight:900;font-size:14px;color:#fff}
.brand b{font-weight:900;letter-spacing:2px;font-size:15px;display:block;line-height:1}
.brand small{color:var(--tenue);font-size:10px;letter-spacing:1px;font-family:'JetBrains Mono',monospace}
nav.tabs{display:flex;gap:2px;flex-wrap:wrap}
nav.tabs>button,.dd>button{background:transparent;border:0;padding:7px 11px;border-radius:8px;font-weight:700;font-size:13px;white-space:nowrap;color:#c9cfdb}
nav.tabs button.on{background:#1b2440;color:#fff;box-shadow:inset 0 -2px 0 var(--nota)}
nav.tabs button:hover:not(.on){background:#151c2e}
.dd{position:relative}
.menu{display:none;position:absolute;top:calc(100% + 8px);left:0;min-width:260px;max-height:62vh;overflow:auto;padding:6px;z-index:20}
.menu.open{display:block}
.menu button{display:flex;width:100%;text-align:left;background:transparent;border:0;padding:8px 10px;border-radius:8px;gap:10px;align-items:center;font-size:13px}
.menu button:hover{background:#1a2236}
.menu i{width:10px;height:10px;border-radius:50%;flex:none}
.menu small{color:var(--tenue);font-size:11px;display:block}
.kpis{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap;align-items:center}
.kpi{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:8px;background:var(--suave);border:1px solid var(--linea);font-size:12px;white-space:nowrap}
.kpi small{color:var(--tenue);font-size:10px;letter-spacing:.5px;text-transform:uppercase}
.kpi b{font-family:'JetBrains Mono',monospace;font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.blink{animation:blink .8s infinite}@keyframes blink{50%{opacity:.2}}
.primary{background:var(--nota)!important;color:#fff!important;border:0;border-radius:9px;padding:8px 14px;font-weight:900;font-size:13px;white-space:nowrap}
.primary:hover{filter:brightness(1.15)}
.ghost{background:var(--suave);border:1px solid var(--linea);border-radius:9px;padding:7px 10px;font-weight:700;font-size:13px}
#toast{position:fixed;top:calc(var(--top,56px) + 10px);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:6;pointer-events:none;width:min(620px,92vw)}
#toast div{border-radius:10px;padding:8px 14px;font-weight:700;font-size:12.5px;text-align:center;border:1px solid}
#toast .r{background:rgba(70,10,14,.94);border-color:var(--roja);color:#ffe4e4}
#toast .a{background:rgba(60,42,6,.94);border-color:var(--ambar);color:#ffefcc}
#log{position:fixed;left:12px;bottom:12px;width:min(430px,calc(100vw - 340px));padding:10px 12px;z-index:4;font-size:11.5px;line-height:1.65}
#log h4,.side h4{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--tenue);margin-bottom:5px;font-weight:700}
#log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:'JetBrains Mono',monospace}
#log a{color:#9fb4ff}
#metas{position:fixed;left:12px;bottom:52px;width:min(330px,calc(100vw - 24px));padding:12px 14px;z-index:4;font-size:12px}
#metas h4{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#cfd6e4;margin-bottom:8px;font-weight:800}
#metas h4 button{background:#1b2133;border:1px solid var(--linea);border-radius:6px;width:24px;height:22px;color:#cfd6e4}
#metas.min #metas-l{display:none}
#metas .m{border-top:1px solid var(--linea);padding:9px 0 4px}
#metas .m:first-child{border-top:0;padding-top:0}

@media(max-width:900px){#metas{display:none}}
#ana{position:fixed;right:12px;bottom:52px;width:min(380px,calc(100vw - 24px));padding:12px 14px;z-index:4;font-size:12px;max-height:calc(100vh - var(--top,110px) - 70px);overflow:auto}
#ana h4{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#cfd6e4;margin-bottom:8px;font-weight:800}

#ana .tot b{display:block;font:700 18px 'JetBrains Mono',monospace;color:#fff}

@media(max-width:900px){#ana{bottom:auto;top:calc(var(--top,110px) + 8px);width:calc(100vw - 24px)}#ana:not(.open-m) #ana-l{display:none}}
#fresh{position:fixed;right:12px;bottom:12px;padding:8px 12px;z-index:4;font-size:11px;color:var(--tenue);font-family:'JetBrains Mono',monospace;display:flex;gap:8px;align-items:center}
#follow{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:none;align-items:center;gap:12px;padding:9px 10px 9px 14px;z-index:6}
#follow.on{display:flex}
#follow b{font-size:14px}
#follow small{display:block;color:var(--tenue);font-size:11px;max-width:52vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel{position:fixed;right:12px;top:calc(var(--top,56px) + 10px);bottom:12px;width:min(500px,calc(100vw - 24px));overflow:auto;padding:16px;z-index:7;display:none}
.panel.on{display:block}
.panel header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.panel h2{font-size:17px;font-weight:900;letter-spacing:.5px}
.panel header .x{margin-left:auto;background:#1a2236;border:0;border-radius:8px;width:30px;height:30px}
#ideas.panel{width:min(1100px,calc(100vw - 24px))}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.card{background:#0f1526;border:1px solid var(--linea);border-radius:10px;padding:12px}
.card.w{grid-column:1/-1}
.card small.t{color:var(--tenue);font-size:10px;letter-spacing:1.3px;text-transform:uppercase;display:block;margin-bottom:4px}
.card .n{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:22px}
.bar{height:8px;background:#1c2540;border-radius:6px;overflow:hidden;margin:8px 0 5px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--nota),#19c3ff);border-radius:6px;min-width:4px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;color:var(--tenue);font-size:9.5px;letter-spacing:1px;text-transform:uppercase;padding:5px 6px;border-bottom:1px solid var(--linea);font-weight:700}
td{padding:7px 6px;border-bottom:1px solid #1a2132;vertical-align:top}
td .mono{font-size:11px}
td small{color:var(--tenue);display:block;font-size:10.5px;margin-top:2px}
.ret{display:grid;grid-template-columns:110px 1fr 46px;gap:8px;align-items:center;margin-top:8px;font-size:12px;font-weight:700}
.ret .track{height:10px;background:#1c2540;border-radius:6px;overflow:hidden;position:relative}
.ret .track i{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
.ret span{font-family:'JetBrains Mono',monospace;text-align:right}
.note{font-size:11.5px;color:var(--tenue);line-height:1.5}
.note b{color:var(--voz)}
.cols{display:grid;grid-template-columns:repeat(5,minmax(180px,1fr));gap:8px;overflow-x:auto}
.col{background:#0f1526;border:1px solid var(--linea);border-radius:10px;padding:8px;min-height:120px}
.col h3{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--tenue);margin:2px 4px 8px;display:flex;justify-content:space-between}
.idea{background:#151d33;border-radius:8px;padding:8px 9px 8px 11px;margin-bottom:6px;border-left:4px solid;font-size:12px;line-height:1.35;position:relative}
.idea small{display:block;color:var(--tenue);font-size:10px;margin-top:3px;font-family:'JetBrains Mono',monospace}
.idea .pin{position:absolute;right:7px;top:7px;width:8px;height:8px;border-radius:50%;background:var(--roja)}
.idea p{color:#aab3c2;font-size:11px;margin-top:4px;display:none}
.idea.open p{display:block}
#modal{position:fixed;inset:0;background:rgba(3,5,10,.6);display:none;place-items:center;z-index:30}
#modal.on{display:grid}
#modal .box{width:min(460px,92vw);padding:20px}
#modal h3{font-size:17px;margin-bottom:8px}
#modal p{font-size:13px;color:#c3cad6;line-height:1.55;margin-bottom:10px}
#modal .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
#modal input{width:100%;background:#0d1322;border:1px solid var(--linea);border-radius:8px;padding:9px 10px;color:var(--voz);font-family:'JetBrains Mono',monospace;font-size:12px}
#modal .msg{font-family:'JetBrains Mono',monospace;font-size:12px;margin-top:10px;min-height:16px}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--noche);z-index:40;font-weight:900;letter-spacing:3px;transition:opacity .5s}
@media (max-width:900px){
  .kpis{margin-left:0;width:100%;order:5}
  #log{display:none}
  #toast{top:auto;bottom:60px}
  .panel{top:auto;height:66vh}
  .grid{grid-template-columns:1fr 1fr}
  #follow{bottom:60px}
}
</style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ================= CONFIG ================= */
const REPO = 'Corosean/fabrica-contenido';
const WORKFLOW = 'publicar.yml';
const FUENTES = { estado:['./data/estado.json','./estado.json'], ideas:['./data/ideas.json','./ideas.json'] };
const REFRESCO_MS = 120000;
const ORDEN = ['enlamejorparte','elporquesecreto','patasarriba.historias','diosenelcaos'];
const CTA = {
  'enlamejorparte':        { short:'Mejor Parte', color:'#e0443e' },
  'elporquesecreto':       { short:'Porqué',      color:'#2f7bff' },
  'patasarriba.historias': { short:'Patas Arriba',color:'#f08a2c' },
  'diosenelcaos':          { short:'Dios',        color:'#d9b44a' },
};
const LUZ = { verde:'#35d07f', ambar:'#ffb020', roja:'#ff4d4d', retirada:'#4b5563' };
const AREA = { porque:'#2f7bff', historia:'#e0443e', perros:'#f08a2c', dios:'#d9b44a', fabrica:'#7a4cff', oficina:'#14a39a', agencia:'#ff8a1f', finanzas:'#35d07f', dropshipping:'#b98a5a', corosean:'#9aa3ad' };
const ESTADOS = [['nueva','Nuevas'],['aprobada','Aprobadas'],['en_curso','En curso'],['hecha','Hechas'],['descartada','Descartadas']];

const $ = s => document.querySelector(s);
const V3 = (x,y,z) => new THREE.Vector3(x,y,z);
const pick = a => a[Math.floor(Math.random()*a.length)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const FLOOR = .12, SPEED = 1.7;
const MOVIL = innerWidth < 900;
function setTop() { document.documentElement.style.setProperty('--top', $('#bar').offsetHeight + 'px'); }

/* ================= DATOS REALES ================= */
const D = { E:null, I:[], ok:false, error:null, cargado:null, run:null };
async function getJSON(urls) {
  for (const u of urls) { try { const r = await fetch(u + '?t=' + Date.now(), { cache:'no-store' }); if (r.ok) return await r.json(); } catch(e) {} }
  throw new Error('no encontrado');
}
async function cargar() {
  try { D.E = await getJSON(FUENTES.estado); D.ok = true; D.error = null; } catch(e) { D.error = 'No pude leer estado.json'; }
  try { const j = await getJSON(FUENTES.ideas); D.I = Array.isArray(j.ideas) ? j.ideas : []; } catch(e) {}
  D.cargado = new Date();
  await leerRun();
  alActualizar();
}
const cuentas = () => { const c = D.E?.cuentas || {}; const ks = [...ORDEN.filter(k => c[k]), ...Object.keys(c).filter(k => !ORDEN.includes(k))]; return ks.map(k => ({ id:k, ...c[k], short:CTA[k]?.short || c[k].nombre, color:CTA[k]?.color || '#9aa3ad' })); };
const cuenta = id => cuentas().find(c => c.id === id);
const colLuz = l => LUZ[l] || '#6b7280';
const parseLocal = s => s ? new Date(s.length <= 16 ? s + ':00' : s) : null;
function hoyISO() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function proxima() {
  let best = null;
  for (const c of cuentas()) for (const p of (c.proximas || [])) { const t = parseLocal(`${p.fecha}T${p.hora}`); if (t && t > new Date() - 30*60e3 && (!best || t < best.t)) best = { t, c, p }; }
  return best;
}
function ventanaPublicacion() { // ¿estamos dentro de los 25 min tras una hora programada?
  const ahora = new Date();
  for (const c of cuentas()) for (const p of (c.proximas || [])) { const t = parseLocal(`${p.fecha}T${p.hora}`); if (t && ahora >= t && ahora - t < 25*60e3) return c; }
  return null;
}
const publicando = () => D.run?.activo ? (D.run.cuenta || cuentas()[0]) : ventanaPublicacion();
const totalPub = () => cuentas().reduce((s,c) => s + (c.publicados_ig || 0), 0);
const totalBanco = () => cuentas().reduce((s,c) => s + (c.banco || 0), 0);
const ideasPor = e => D.I.filter(i => i.estado === e);
function retencionMedia() { const v = cuentas().map(c => c.analiticas?.retencion_media_pct).filter(x => typeof x === 'number'); return v.length ? v.reduce((a,b) => a+b, 0)/v.length : null; }
function antiguedadMin() { const t = parseLocal(D.E?.actualizado); return t ? Math.round((new Date() - t)/60e3) : null; }

/* --- botón directo (opcional): token SOLO en este navegador --- */
const TK = 'oficina_token_actions';
const getTok = () => { try { return localStorage.getItem(TK) || ''; } catch(e) { return ''; } };
async function leerRun() {
  const tok = getTok(); if (!tok) { D.run = null; return; }
  try {
    const r = await fetch(`https://api.github.com/repos/${REPO}/actions/workflows/${WORKFLOW}/runs?per_page=1`, { headers:{ Authorization:`Bearer ${tok}`, Accept:'application/vnd.github+json' } });
    if (!r.ok) { D.run = { error:r.status }; return; }
    const j = await r.json(), w = j.workflow_runs?.[0];
    D.run = w ? { activo: w.status === 'in_progress' || w.status === 'queued', estado:w.status, conclusion:w.conclusion, url:w.html_url, fecha:w.created_at } : null;
  } catch(e) { D.run = { error:'red' }; }
}
async function lanzar(inputs = { ya:'true' }) {
  const tok = getTok();
  const r = await fetch(`https://api.github.com/repos/${REPO}/actions/workflows/${WORKFLOW}/dispatches`, { method:'POST', headers:{ Authorization:`Bearer ${tok}`, Accept:'application/vnd.github+json', 'Content-Type':'application/json' }, body:JSON.stringify({ ref:'main', inputs }) });
  return r.status;
}
/* la última fabricación de prueba que terminó bien, con su enlace de descarga */
async function ultimaPrueba() {
  const tok = getTok(); if (!tok) return null;
  try {
    const h = { Authorization:`Bearer ${tok}`, Accept:'application/vnd.github+json' };

let mode = 'planta', followAg = null, fly = null;
const lastFollow = V3();
function flyTo(p, t, ms = 1700) { fly = { p0:camera.position.clone(), t0:controls.target.clone(), p1:p, t1:t, s:performance.now(), d:ms }; }
controls.addEventListener('start', () => { fly = null; });
function setTab(v) { document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.v === v || b.dataset.dd === v)); }

function viewPlanta() { mode = 'planta'; stopFollow(); cerrarPaneles(); setTab('planta'); const a = innerWidth/innerHeight, f = a < .8 ? 3 : a < 1.2 ? 1.5 : 1.12, tx = a < .8 ? -2 : 3; flyTo(V3(tx+24*f,36*f,2+38*f), V3(tx,0,2)); }

function viewFollow(ag) { mode = 'seguir'; cerrarPaneles(); setTab('m-agentes'); followAg = ag; lastFollow.copy(ag.pos); const t = V3(ag.pos.x, 1.1, ag.pos.z); flyTo(V3(t.x+4.4, 5, t.z+7), t, 1100);
  $('#follow').classList.add('on'); $('#f-dot').style.background = ag.shirt; $('#f-name').textContent = ag.name; hud(); }
function stopFollow() { followAg = null; $('#follow').classList.remove('on'); }
function viewControl() { mode = 'control'; stopFollow(); cerrarPaneles(); setTab('control'); $('#control').classList.add('on'); const a = innerWidth/innerHeight; flyTo(a < .8 ? V3(-19,3.4,-3.5) : V3(-17.6,3.1,-4.4), V3(a < .8 ? -19 : -17.4, a < .8 ? 2.9 : 1.8, -13.8)); renderControl(); }
function viewIdeas() { mode = 'ideas'; stopFollow(); cerrarPaneles(); setTab('ideas'); $('#ideas').classList.add('on'); renderIdeas(); flyTo(V3(10.3, 3.2, 12.5), V3(10.3, 1.7, 4.7)); }

$('#m-salas').innerHTML = ROOMS.map((r,i) => `<button data-r="${i}"><i style="background:${r.active?'#35d07f':r.prio?'#ff8a1f':'#6b7280'}"></i><div>${r.name}<small>${r.active ? r.sub : r.prio ? 'prioritaria · abre pronto' : 'próximamente'}</small></div></button>`).join('');

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(); let down = null;
const PICK = []; AGENTS.forEach(a => a.v.root.traverse(o => { if (o.isMesh) PICK.push(o); }));
renderer.domElement.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX-down[0], e.clientY-down[1]) > 6) return;
  ndc.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1); ray.setFromCamera(ndc, camera);
  const h = ray.intersectObjects(PICK, false)[0]; if (h) return viewFollow(h.object.userData.agent);
  const f = ray.intersectObjects(FLOORS, false)[0]; if (f && (mode === 'planta' || mode === 'sala' || mode === 'seguir')) { const r = f.object.userData.room; r.id === 'ideas' ? viewIdeas() : viewRoom(r); }
});
addEventListener('resize', () => { setTop(); camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

/* ================= TARJETAS VOLANDO ================= */
const FLY = []; let flyT = 0;
function spawnCard() { const c = publicando(); const m = new THREE.MeshBasicMaterial({ color:c?.color || '#2f7bff', transparent:true, toneMapped:false }); FLY.push({ card:at(new THREE.Mesh(new THREE.PlaneGeometry(.34,.5), m), PUBMON.x, PUBMON.y, PUBMON.z), m, t:0 }); }

/* ================= BUCLE ================= */
function alActualizar() { drawBoard(); drawDir(); drawIdeasBoard(); drawRet(); hud(); if (mode === 'ideas') renderIdeas(); }
const clock = new THREE.Clock(); let scrT = 0, hudT = 0, scrI = 0, fpsT = 0, fpsN = 0, calidad = renderer.getPixelRatio();
const ease = k => k < .5 ? 4*k*k*k : 1 - Math.pow(-2*k+2, 3)/2;
viewPlanta(); camera.position.copy(fly.p1); controls.target.copy(fly.t1); fly = null;
alActualizar();
function loop() {
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  for (const a of AGENTS) a.update(dt, t);
  if (followAg) { const d = followAg.pos.clone().sub(lastFollow); lastFollow.copy(followAg.pos); camera.position.add(d); controls.target.add(d); if (fly) { fly.p0.add(d); fly.t0.add(d); fly.p1.add(d); fly.t1.add(d); } }
  if (fly) { const k = Math.min(1, (performance.now()-fly.s)/fly.d), e = ease(k); camera.position.lerpVectors(fly.p0, fly.p1, e); controls.target.lerpVectors(fly.t0, fly.t1, e); if (k >= 1) fly = null; }
  controls.update();
  for (const r of ROOMS) r.sign.visible = mode === 'planta';
  const ocultar = mode === 'control' || mode === 'ideas';
  for (const a of AGENTS) { a.bub.sp.material.opacity = ocultar ? 0 : 1; a.tag.material.opacity = ocultar ? 0 : 1; }
  let alerta = false;
  for (const s of STATIONS) { const c = cuenta(s.id), col = c ? colLuz(c.luz) : '#6b7280', on = !c || c.luz === 'verde' || Math.sin(t*(c.luz === 'roja' ? 10 : 4)) > 0; s.bm.emissive.set(col); s.bm.emissiveIntensity = on ? 2.4 : .15; s.halo.material.color.set(col); s.halo.material.opacity = on ? .9 : .1; if (c?.luz === 'roja') alerta = true; }
  alarm.intensity = alerta ? 14 + 12*Math.sin(t*7) : 0;
  const pub = publicando();
  cloud.position.y = 4.1 + Math.sin(t*1.3)*.12; cloudMat.emissiveIntensity = pub ? .5 + .3*Math.sin(t*6) : .12;
  towerLeds.forEach((m,i) => m.emissiveIntensity = pub ? (Math.sin(t*14+i*2) > 0 ? 3 : .2) : 1.2);
  rackLeds.forEach((m,i) => m.emissiveIntensity = Math.sin(t*(3+i)+i) > -.2 ? 2 : .2);
  pin.position.y = 2.2 + Math.sin(t*2)*.18; pin.rotation.y = t; prioRing.material.opacity = .25 + .25*Math.sin(t*3);
  if (pub && AG['AGT-10'].act === 'publicando') { flyT += dt; if (flyT > .8) { flyT = 0; spawnCard(); } }
  for (let i = FLY.length-1; i >= 0; i--) { const f = FLY[i]; f.t += dt/1.5; f.card.position.lerpVectors(PUBMON, cloud.position, f.t); f.card.position.y += Math.sin(f.t*Math.PI)*.8; f.card.rotation.y = f.t*6; f.m.opacity = 1 - f.t*f.t; if (f.t >= 1) { scene.remove(f.card); f.card.geometry.dispose(); f.m.dispose(); FLY.splice(i,1); } }
  scrT += dt; if (scrT > .07 && SCREENS.length) { scrT = 0; scrI = (scrI + 1) % SCREENS.length; drawScreen(SCREENS[scrI], t); }
  hudT += dt; if (hudT > 15) { hudT = 0; hud(); drawDir(); }
  fpsN++;
  if (fpsN >= 90) { const fps = fpsN / ((performance.now() - (loop.t0 || performance.now())) / 1000 || 1); loop.t0 = performance.now(); fpsN = 0;
    if (fps < 42 && calidad > 1) { calidad = Math.max(1, calidad - .25); renderer.setPixelRatio(calidad); }
    if (fps < 32 && sun.shadow.mapSize.x > 1024) { sun.shadow.mapSize.set(1024,1024); sun.shadow.map?.dispose(); sun.shadow.map = null; } }
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();

function pintaMetas(M){
  var cont = document.querySelector('#metas-l'); if(!cont) return;
  if(!M || !M.length){ cont.innerHTML = '<div class="vacio">Sin metas activas.</div>'; return; }
  var col = {verde:'#44d07b', ambar:'#f2b23c', roja:'#ef5f5f'};
  cont.innerHTML = M.map(function(m){
    var c = col[m.luz] || '#f2b23c';
    var mo = m.moneda || '\u20ac';
    var eur = function(n){ return Math.round(n).toLocaleString('es-ES') + ' ' + mo; };
    var ritmo = '';
    if (m.pct >= 100) ritmo = '<div class="ritmo"><b>\u00a1Conseguida!</b></div>';
    else if (m.por_semana) ritmo = '<div class="ritmo">Hacen falta <b>' + eur(m.por_semana) + '/semana</b> durante ' + m.dias + ' d\u00edas</div>';
    else if (m.dias !== null && m.dias <= 0) ritmo = '<div class="ritmo"><b>Fecha pasada</b></div>';
    return '<div class="m">' +
      '<div class="h"><b>' + m.nombre + '</b><span>' + m.pct + '%</span></div>' +
      '<div class="bar"><i style="width:' + Math.min(100, m.pct) + '%;background:' + c + '"></i></div>' +
      '<div class="cifras"><span>' + eur(m.ahorrado) + ' de ' + eur(m.objetivo) + '</span><span>faltan ' + eur(m.falta) + '</span></div>' +
      ritmo +
      (m.doc ? '<div class="ritmo"><a href="' + m.doc + '" target="_blank" rel="noopener">Ver la lista de la compra \u2192</a></div>' : '') +
      '</div>';
  }).join('');
